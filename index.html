<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Movie - Premium Store</title>
    <style>
        :root {
            --primary: #e50914;
            --bg-dark: #0b0f19;
            --card-bg: #111827;
            --input-bg: #1f2937;
            --text-gold: #f39c12;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid #1f2937;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .header h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 3px;
            font-size: 32px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(229, 9, 20, 0.3);
        }

        .header p {
            color: #9ca3af;
            text-align: center;
            font-size: 13px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Navigasi Ganti Halaman (Tabs) */
        .tab-navigation {
            display: flex;
            background-color: #1f2937;
            padding: 5px;
            border-radius: 14px;
            margin-bottom: 25px;
            border: 1px solid #374151;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #9ca3af;
            padding: 12px;
            font-weight: 600;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
        }

        /* Pengaturan Tampilan Halaman */
        .page {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-badge {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background-color: #1f2937;
            padding: 10px;
            border-radius: 30px;
            margin-bottom: 25px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: 1px solid #374151;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #25d366;
            border-radius: 50%;
            box-shadow: 0 0 8px #25d366;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(37, 211, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        .price-section h3 {
            font-size: 14px;
            color: var(--primary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
            margin-top: 20px;
        }

        .produk-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(145deg, #1f2937, #111827);
            padding: 14px 18px;
            margin-bottom: 10px;
            border-radius: 14px;
            font-size: 14px;
            border: 1px solid #1f2937;
            transition: 0.2s;
        }

        .produk-item:hover {
            border-color: #374151;
        }

        .nama-paket { font-weight: 500; }
        .harga { font-weight: 700; color: var(--text-gold); font-size: 15px; }

        /* Box QRIS Premium */
        .pembayaran-container {
            background-color: #1f2937;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            border: 1px dashed #4b5563;
            margin-bottom: 15px;
        }

        .qris-btn {
            background: linear-gradient(135deg, #e50914, #b80710);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
            transition: 0.3s;
        }

        .qris-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(229, 9, 20, 0.4); }

        /* Form Styling */
        .input-group { margin-bottom: 15px; }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #4b5563;
            background-color: #111827;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            transition: 0.2s;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(229, 9, 20, 0.2);
        }

        .btn-wa {
            display: block;
            width: 100%;
            text-align: center;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: white;
            border: none;
            font-weight: 700;
            padding: 15px;
            border-radius: 14px;
            margin-top: 20px;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: 0.3s;
            box-sizing: border-box;
        }

        .btn-wa:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4); }

        /* Modal QRIS */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            max-width: 320px;
            width: 85%;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content img { width: 100%; height: auto; border-radius: 10px; border: 1px solid #e5e7eb; }
        .close-btn {
            background-color: #111827;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        /* Fitur Keren Tambahan: Testimoni Berjalan (Marquee) */
        .review-box {
            margin-top: 30px;
            background-color: #1f2937;
            padding: 10px;
            border-radius: 12px;
            overflow: hidden;
            font-size: 12px;
            color: #9ca3af;
            border: 1px solid #374151;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>GALAXY MOVIE</h1>
            <p>Proses Cepat • Garansi Full Durasi • 4K UHD</p>
        </div>

        <div class="status-badge">
            <span class="dot"></span>
            <span>ADMIN SEDANG ONLINE & SIAP PROSES</span>

        <!-- Tombol Menu Ganti Halaman -->
        <div class="tab-navigation">
            <button class="tab-btn active" onclick="bukaHalaman(event, 'halaman-harga')">🏷️ Daftar Harga</button>
            <button class="tab-btn" onclick="bukaHalaman(event, 'halaman-order')">🛒 Form Order</button>

        <!-- HALAMAN 1: DAFTAR HARGA -->
        <div id="halaman-harga" class="page active">

                <div class="produk-item"><span class="nama-paket">Sharing 1 Hari</span><span class="harga">Rp 10.000</span></div>

                <div class="produk-item"><span class="nama-paket">Sharing 1 Bulan</span><span class="harga">Rp 20.000</span></div>

            </div>

            <div class="price-section">
                <h3>👑 NETFLIX PRIVATE (FULL AKUN UTUH)</h3>
                <div class="produk-item"><span class="nama-paket">Private 1 Hari</span><span class="harga">Rp 12.000</span></div>
